apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ping-service.fullname" . }}
  labels:
    {{- include "ping-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ping-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ping-service.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "ping-service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ping-service.fullname" . }}-config