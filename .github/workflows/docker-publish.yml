name: Build JAR &amp; Publish Docker Image

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: amir87/ping-service
  DOCKER_BUILD_SUMMARY: false

jobs:
  changes:
    name: Check for source changes
    runs-on: ubuntu-latest
    outputs:
      source_changed: ${{ steps.resolve.outputs.source_changed }}
    steps:
      # Full history: paths-filter diffs the push base against HEAD.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # 'some-with-excludes' keeps negations effective: a file matches
          # only if it hits '**' AND none of the negated patterns.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            source:
              - '**'
              - '!deployment/**'
              - '!target/**'
              - '!.idea/**'

      - name: Resolve source_changed
        env:
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          FILTER_HIT: ${{ steps.filter.outputs.source }}
        run: |
          # Tags are release events and manual runs are explicit requests:
          # always build. Otherwise require a real source file to change.
          if [ "$REF_TYPE" = "tag" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$FILTER_HIT" = "true" ]; then
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
            echo "Only deployment/target/.idea files changed - skipping build and image jobs."
          fi

  build:
    name: Build and test JAR
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.source_changed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Maven can resolve the project version from SCM.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          # Must match <java.version>25</java.version> in pom.xml.
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build JAR (tests run)
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
        env:
          MAVEN_OPTS: -Dstyle.color=always

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ping-service-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: needs.changes.outputs.source_changed == 'true'
    permissions:
      contents: read
    # Publish only for pushes to the branch or a release tag; PRs still build the
    # image but never push, so forks cannot poison the registry.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Skipped for PRs from forks, where secrets are unavailable.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Two tags only: `latest` and the 7-character commit hash.
          # `latest` is written explicitly because metadata-action only adds it
          # automatically for semver/tag events, not for plain branch pushes.
          # The enable= guard keeps `latest` off PR builds, which never push.
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max